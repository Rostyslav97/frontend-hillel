<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Product</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js" defer></script>
    <script src="../scripts/model/router/SingleRoute.js" type="module" defer></script>
    <script src="../scripts/model/router/RouterModel.js" type="module" defer></script>
    <script src="../scripts/model/router/routerConfig.js" type="module" defer></script>
    <script src="../scripts/controller/router/RouterController.js" type="module" defer></script>
    <script src="../scripts/view/router/RouterView.js" type="module" defer></script>

<!--    Product handling-->
  <script src="../scripts/model/product/SingleProduct.js" defer type="module"></script>
  <script src="../scripts/model/product/ProductModel.js" defer type="module"></script>
  <script src="../scripts/controller/product/ProductController.js" defer type="module"></script>
  <script src="../scripts/view/product/ProductView.js" defer type="module"></script>

</head>
<body>
  <header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="#">Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>
</header>


  <main>
    <h1 class="mt-3 text-center">Create Product</h1>
    <div class="container py-5">
      <div class="row" id="product-preferences-wrapper">
        <div class="col-9">
          <form data-form="productCreate">
            <div class="mb-3">
              <label for="product-title" class="form-label">Product title</label>
              <input type="text" class="form-control" id="product-title" name="product-title">
            </div>

            <div class="mb-3">
              <label for="img-url" class="form-label">Img URL</label>
              <input type="url" class="form-control" id="img-url" name="img-url" >
            </div>

            <div class="mb-3">
              <label for="product-description" class="form-label">Product description</label>
              <textarea name="product-description" id="product-description" cols="30" rows="10" class="form-control"></textarea>
            </div>


            <button type="submit" class="btn btn-primary">Save</button>
            <button type="reset" class="btn btn-danger">Reset form</button>
          </form>
        </div>
        <div class="col-3 h1 border d-flex justify-content-center align-items-center flex-column" data-img-preview>
          <h4>Img preview</h4>
          <i class="bi bi-cloud-upload"></i>
        </div>
    </div>
    </div>
  </main>


</body>
</html>
