<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список справ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
    <h1 class="text-center mt-5 mb-5">Список справ</h1>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <form id="todoForm">
                    <div class="mb-3">
                        <label class="form-label">Назва завдання</label>
                        <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Введіть назву"
                                required
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Опис завдання</label>
                        <textarea
                                name="description"
                                class="form-control"
                                placeholder="Детальний опис"
                                cols="30"
                                rows="10"
                                required
                        ></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <div>
                            <input
                                    type="submit"
                                    class="btn btn-primary"
                                    value="Створити завдання"
                            >
                            <input
                                    type="reset"
                                    value="Очистити"
                                    class="btn btn-warning"
                            >
                        </div>
                        <button type="button" class="btn btn-danger remove-all">
                            Видалити всі
                        </button>
                    </div>
                </form>
            </div>

            <div class="col-8">
                <div class="row" id="todoItems">
                </div>
            </div>
        </div>
    </div>
</main>

<script src="./js/controller/index.js"></script>
<script src="./js/model/index.js"></script>
<script src="./js/view/index.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
